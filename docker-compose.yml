services:

  wordpress:
    image: ${WORDPRESS_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME}-wordpress
    restart: unless-stopped

    ports:
      - "127.0.0.1:${WORDPRESS_PORT}:80"

    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - wordpress_data:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/wordpress.ini:ro

    depends_on:
      db:
        condition: service_healthy

    networks:
      - wordpress_network


  db:
    image: ${MYSQL_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - wordpress_network


volumes:

  wordpress_data:
    name: ${COMPOSE_PROJECT_NAME}_wordpress_data

  mysql_data:
    name: ${COMPOSE_PROJECT_NAME}_mysql_data


networks:

  wordpress_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    driver: bridge
